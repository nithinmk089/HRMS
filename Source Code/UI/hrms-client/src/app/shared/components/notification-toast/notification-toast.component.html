<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
  @for (toast of toasts; track toast.id) {
    <div 
      class="toast show align-items-center border-0 mb-3" 
      [class.bg-success]="toast.type === 'success'" 
      [class.bg-danger]="toast.type === 'danger'" 
      [class.bg-warning]="toast.type === 'warning'" 
      [class.bg-primary]="toast.type === 'info'" 
      role="alert" 
      aria-live="assertive" 
      aria-atomic="true">
      <div class="d-flex text-white">
        <div class="toast-body d-flex align-items-center gap-2">
          @switch (toast.type) {
            @case ('success') { <i class="bi bi-check-circle-fill fs-4 text-white"></i> }
            @case ('danger') { <i class="bi bi-exclamation-octagon-fill fs-4 text-white"></i> }
            @case ('warning') { <i class="bi bi-exclamation-triangle-fill fs-4 text-white"></i> }
            @case ('info') { <i class="bi bi-info-circle-fill fs-4 text-white"></i> }
          }
          <span>{{ toast.message }}</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="onClose(toast.id)" aria-label="Close"></button>
      </div>
    </div>
  }
</div>

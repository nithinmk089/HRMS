@if (isOpen && role) {
  <div class="modal-backdrop-custom"></div>
  <div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Role Members: {{ role.roleName }}</h5>
          <button type="button" class="btn-close" (click)="onClose()" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-4">
            <label class="form-label fs-8 text-secondary">Search Users</label>
            <input 
              type="text" 
              class="form-control form-control-sm" 
              placeholder="Search by username or email..." 
              [(ngModel)]="userSearchText" 
              (keyup)="filterUsers()">
          </div>

          @if (isLoading) {
            <div class="d-flex justify-content-center align-items-center py-10">
              <span class="spinner-border text-primary"></span>
            </div>
          } @else {
            <div class="user-assignment-list" style="max-height: 300px; overflow-y: auto;">
              @for (user of filteredUsers; track user.userId) {
                <div class="d-flex align-items-center justify-content-between p-2 mb-1 border-bottom">
                  <div>
                    <div class="fw-bold fs-7">{{ user.userName }}</div>
                    <div class="text-muted fs-8">{{ user.email }}</div>
                  </div>
                  <div class="form-check form-switch">
                    <input 
                      class="form-check-input" 
                      type="checkbox" 
                      [checked]="isUserAssigned(user.userId)"
                      (change)="toggleUserRoleMembership(user.userId, $event)">
                  </div>
                </div>
              } @empty {
                <div class="text-gray-400 text-center py-5">No tenant users found.</div>
              }
            </div>
          }
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary btn-sm" (click)="onClose()">Done</button>
        </div>
      </div>
    </div>
  </div>
}

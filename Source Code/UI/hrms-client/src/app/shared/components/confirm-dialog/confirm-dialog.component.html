@if (isOpen) {
  <div class="modal fade show d-block" tabindex="-1" role="dialog" style="background-color: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-dark">{{ title }}</h5>
          <button type="button" class="btn btn-icon btn-sm btn-active-light-primary" (click)="onCancel()">
            <i class="bi bi-x fs-2"></i>
          </button>
        </div>
        
        <div class="modal-body py-5">
          <p class="text-gray-600 fs-6">{{ message }}</p>
        </div>
        
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-light" (click)="onCancel()">{{ cancelText }}</button>
          <button 
            type="button" 
            [class]="isDanger ? 'btn btn-danger' : 'btn btn-primary'" 
            (click)="onConfirm()">
            {{ confirmText }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
